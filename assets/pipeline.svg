<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" role="img" aria-label="Pipeline diagram: Build (React, TypeScript, Node.js, Express, REST APIs, databases) flows into Think (Python, TensorFlow, XGBoost, automation, AI output evaluation) flows into Ship (Docker, GitHub Actions, Railway, Postman), with a feedback loop back to Build." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Build, think, ship pipeline</title>
<style>
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .flow{animation:flow 1.4s linear infinite}
  .back{animation-direction:reverse}
  @keyframes flow{to{stroke-dashoffset:-20}}
  @media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
